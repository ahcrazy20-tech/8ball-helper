name: Build PoolHelper dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          # Install Theos (official installer)
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" || true
          
          # Theos can be in /opt/theos or ~/theos - find it
          if [ -d "/opt/theos" ]; then
            echo "THEOS=/opt/theos" >> $GITHUB_ENV
          else
            echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          fi
          
          # Add ldid and other tools to PATH
          echo "/opt/theos/bin" >> $GITHUB_PATH
          echo "$HOME/theos/bin" >> $GITHUB_PATH
      
      - name: Show Theos location
        run: |
          echo "THEOS is at $THEOS"
          ls -la $THEOS || ls -la ~/theos || ls -la /opt/theos
          which ldid || echo "ldid not in PATH"
      
      - name: Build dylib
        working-directory: ./ios-live-helper
        run: |
          export THEOS=$THEOS
          make clean
          make package FINALPACKAGE=1
          echo "Build done, checking output:"
          find . -name "*.dylib" -o -name "*.deb" | head -20
          ls -lh .theos/obj/ || true
          ls -lh .theos/obj/debug/ || true
      
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          find ios-live-helper -name "*.dylib" -exec cp {} artifact/ \; || true
          find ios-live-helper -name "*.deb" -exec cp {} artifact/ \; || true
          cp ios-live-helper/.theos/obj/debug/libPoolHelper.dylib artifact/ 2>/dev/null || true
          cp ios-live-helper/.theos/obj/debug/arm64/*.dylib artifact/ 2>/dev/null || true
          ls -lh artifact/
      
      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoolHelper-dylib
          path: artifact/
          retention-days: 30
      
      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: artifact/*
